<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<style>
/* ==================== 基础 ==================== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#120f1c; --bg-card:#1c1830; --bg-elev:#262041; --border:#38305c;
  --text:#f0eaff; --text-dim:#9f94c4; --text-muted:#6d6396;
  --accent:#e14dff; --accent2:#ff5fb0; --gold:#ffd166; --green:#57d9a3; --red:#ff6b6b;
  --blue:#5fa8ff; --shadow:0 2px 14px rgba(0,0,0,.4); --radius:16px;
}
html,body{width:100%;min-height:100%;background:var(--bg);color:var(--text);
  font-family:'PingFang SC','Microsoft YaHei',system-ui,-apple-system,sans-serif;
  overflow-x:hidden}
#app{max-width:520px;margin:0 auto;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 24px);position:relative}
.screen{display:none}
.screen.active{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ==================== 通用组件 ==================== */
h1.page-title{font-size:21px;font-weight:800;text-align:center;margin:4px 0 2px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
p.page-sub{font-size:12px;color:var(--text-dim);text-align:center;margin-bottom:12px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.btn{display:block;width:100%;padding:13px 14px;border:none;border-radius:12px;cursor:pointer;
  background:var(--bg-elev);color:var(--text);font-size:15px;font-weight:600;margin-top:8px;
  transition:transform .08s,filter .15s;font-family:inherit;text-align:left;line-height:1.5}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;text-align:center}
.btn.ghost{background:transparent;border:1px solid var(--border)}
.btn.small{padding:8px 12px;font-size:12px;width:auto;display:inline-block;margin:4px 6px 0 0;text-align:center}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;background:var(--bg-elev);color:var(--text-dim);margin:2px 4px 2px 0}
.tag.hot{color:#fff;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.tag.main{color:var(--gold);border:1px solid var(--gold)}
.tag.side{color:var(--blue);border:1px solid var(--blue)}
.tag.harem{color:var(--green);border:1px solid var(--green)}
.tag.virgin{color:var(--red);border:1px solid var(--red)}
input[type=text],select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);
  background:var(--bg-elev);color:var(--text);font-size:15px;outline:none;font-family:inherit}
input[type=text]:focus{border-color:var(--accent)}
label.lbl{display:block;font-size:12px;color:var(--text-dim);margin:10px 0 4px}
.hint{font-size:11px;color:var(--text-muted);margin-top:4px;line-height:1.5}

/* ==================== 顶栏 ==================== */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.topbar .badge{font-size:12px;background:var(--bg-elev);border:1px solid var(--border);
  border-radius:999px;padding:5px 12px;color:var(--text-dim)}
.topbar .lust-badge{font-size:13px;font-weight:800;color:var(--accent);
  background:var(--bg-elev);border:1px solid var(--accent);border-radius:999px;padding:5px 12px}
.icon-btn{background:var(--bg-elev);border:1px solid var(--border);color:var(--text-dim);
  border-radius:10px;padding:6px 10px;font-size:12px;cursor:pointer}

/* ==================== 状态条 ==================== */
.statbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.stat-cell{flex:1;min-width:90px;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:8px 10px;text-align:center}
.stat-cell .k{font-size:11px;color:var(--text-dim)}
.stat-cell .v{font-size:17px;font-weight:800}
.stat-cell .bar{height:4px;background:#3a3350;border-radius:2px;margin-top:4px;overflow:hidden}
.stat-cell .bar>i{display:block;height:100%;border-radius:2px;transition:width .4s}
.bar-affection>i{background:linear-gradient(90deg,var(--accent),var(--accent2))}
.bar-lust>i{background:var(--red)}
.bar-mood>i{background:var(--gold)}
.bar-energy>i{background:var(--green)}

/* ==================== 剧情区 ==================== */
.story-box{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;min-height:200px;max-height:44dvh;overflow-y:auto;margin-bottom:12px;box-shadow:var(--shadow);
  line-height:1.9;font-size:15px;white-space:pre-wrap}
.story-box .spk{color:var(--accent2);font-weight:700}
.story-box .sys-note{color:var(--text-muted);font-size:12px}
.story-box .roll{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;margin-left:6px}
.roll.crit{background:var(--gold);color:#2a2410}
.roll.ok{background:var(--green);color:#0e2b1f}
.roll.fail{background:var(--red);color:#fff}
.roll.bad{background:#7a2c2c;color:#ffd0d0}
.typing-caret::after{content:'▌';color:var(--accent);animation:blink .8s step-end infinite}
@keyframes blink{50%{opacity:0}}

/* ==================== 女生列表 ==================== */
.girl-card{display:flex;gap:12px;align-items:center;background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px;margin-bottom:10px;cursor:pointer;transition:border-color .15s}
.girl-card:active{border-color:var(--accent)}
.girl-avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;color:#fff}
.girl-info{flex:1;min-width:0}
.girl-info .g-name{font-size:15px;font-weight:700}
.girl-info .g-meta{font-size:11px;color:var(--text-dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.girl-info .g-bar{height:5px;background:#3a3350;border-radius:3px;margin-top:6px;overflow:hidden}
.girl-info .g-bar>i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}
.girl-side{text-align:right;flex-shrink:0}
.girl-side .g-lust{font-size:13px;font-weight:800;color:var(--red)}
.girl-side .g-state{font-size:11px;color:var(--text-dim);margin-top:2px}

/* ==================== 互动选项 ==================== */
.opt{margin-top:10px}
.opt .req{font-size:11px;color:var(--text-muted);display:block;margin-top:2px}
.opt.hidden{display:none}

/* ==================== 商城 ==================== */
.shop-item{display:flex;gap:10px;align-items:center;background:var(--bg-elev);border-radius:12px;padding:11px;margin-bottom:8px}
.shop-item .s-ico{font-size:24px;flex-shrink:0}
.shop-item .s-info{flex:1;min-width:0}
.shop-item .s-name{font-size:14px;font-weight:700}
.shop-item .s-desc{font-size:11px;color:var(--text-dim);margin-top:2px}
.shop-item .s-price{font-size:13px;color:var(--accent);font-weight:800;flex-shrink:0}
.shop-item button{background:var(--bg-card);border:1px solid var(--accent);color:var(--accent);
  border-radius:10px;padding:7px 12px;font-size:12px;cursor:pointer;flex-shrink:0}
.shop-item button:disabled{opacity:.4;cursor:not-allowed}

/* ==================== 成就 ==================== */
.ach-item{display:flex;gap:10px;align-items:center;background:var(--bg-elev);border-radius:12px;padding:10px;margin-bottom:8px;opacity:.5}
.ach-item.unlocked{opacity:1}
.ach-item .a-ico{font-size:22px}
.ach-item .a-info{flex:1}
.ach-item .a-name{font-size:13px;font-weight:700}
.ach-item .a-desc{font-size:11px;color:var(--text-dim)}

/* ==================== Tab 栏 ==================== */
.tab-bar{display:flex;gap:6px;margin-bottom:10px;position:sticky;top:0;z-index:10;background:var(--bg);padding:6px 0}
.tab-bar .tab{flex:1;text-align:center;padding:10px 2px;border-radius:10px;background:var(--bg-elev);
  border:1px solid var(--border);color:var(--text-dim);font-size:13px;cursor:pointer}
.tab-bar .tab.on{color:#fff;background:linear-gradient(90deg,var(--accent),var(--accent2));border-color:transparent}

/* ==================== 结局/结算 ==================== */
.end-hero{text-align:center;padding:26px 10px}
.end-hero .emoji{font-size:52px}
.end-hero h2{font-size:24px;margin:10px 0 6px;background:linear-gradient(90deg,var(--gold),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.end-hero .sub{color:var(--text-dim);font-size:13px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats-grid .cell{background:var(--bg-elev);border-radius:10px;padding:8px;text-align:center}
.stats-grid .cell .k{font-size:11px;color:var(--text-dim)}
.stats-grid .cell .v{font-size:15px;font-weight:700;margin-top:2px}

/* ==================== 后宫 ==================== */
.harem-hero{text-align:center;padding:14px 6px}
.harem-hero .h-count{font-size:34px;font-weight:900;background:linear-gradient(90deg,var(--gold),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.harem-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.harem-cell{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:12px;text-align:center}
.harem-cell .h-avatar{width:44px;height:44px;border-radius:50%;margin:0 auto 6px;background:linear-gradient(135deg,var(--gold),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:20px}
.harem-cell .h-name{font-size:13px;font-weight:700}
.harem-cell .h-desc{font-size:10px;color:var(--text-dim);margin-top:2px}
.harem-cell.empty{opacity:.35;border-style:dashed}

/* 滚动条 */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#4a4163;border-radius:2px}
</style>
</head>

const SAVE_PREFIX = "lust_system_save_";   // 3 个存档位: lust_system_save_1/2/3
const SLOT_COUNT = 3;
const CURRENT_SLOT_KEY = "lust_system_current_slot";
let STATE = null;
let CURRENT_SLOT = 1;

/* ---------- 存档槽管理 ---------- */
function slotKey(n){ return SAVE_PREFIX + n; }
function saveMeta(n){
  try{
    localStorage.setItem(slotKey(n) + "_meta", JSON.stringify({
      day: STATE.day, harem: STATE.harem.length, lust: STATE.lust,
      name: STATE.playerName, time: Date.now(),
    }));
  }catch(e){}
}
function getSlotMeta(n){
  try{
    const raw = localStorage.getItem(slotKey(n) + "_meta");
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveToSlot(n){
  try{
    localStorage.setItem(slotKey(n), JSON.stringify(STATE));
    saveMeta(n);
  }catch(e){}
}
function loadFromSlot(n){
  try{
    const raw = localStorage.getItem(slotKey(n));
    if(raw){ STATE = JSON.parse(raw); CURRENT_SLOT = n; return true; }
  }catch(e){}
  return false;
}
/* 当前档自动保存 */
function save(){
  saveToSlot(CURRENT_SLOT);
}
/* 读当前档（无档则新开） */
function load(){
  const cur = parseInt(localStorage.getItem(CURRENT_SLOT_KEY)) || 1;
  if(!loadFromSlot(cur)){
    STATE = defaultState();
    CURRENT_SLOT = cur;
    saveToSlot(cur);
  } else {
    ensureStateCompat();
  }
}
/* 存档兼容性：补充新字段 */
function ensureStateCompat(){
  if(!STATE.hardware) STATE.hardware = { len: CONFIG.hardware.len.init, girth: CONFIG.hardware.girth.init, dura: CONFIG.hardware.dura.init };
  if(!STATE.assets) STATE.assets = { car: [], house: [], luxury: [] };
  if(!STATE.shopState) STATE.shopState = { day: 0, items: [], assets: { car: [], house: [], luxury: [] }, manualItemRefreshes: 0, manualAssetRefreshes: 0 };
  if(!STATE.friends) STATE.friends = [];   // 旧档兼容：无则空，激活时生成核心 2 人
  if(STATE.playerDeflowered === undefined) STATE.playerDeflowered = false;
  if(STATE.bound === undefined) STATE.bound = true; // 旧存档兼容：已有数据 = 已绑定
  // 角色卡记忆兼容
  Object.values(STATE.girls).forEach(g => {
    if(!g.memories) g.memories = [];
    if(!g.milestones) g.milestones = [];
  });
}
/* 新开档 */
function newGame(slot){
  STATE = defaultState();
  CURRENT_SLOT = slot || 1;
  try{ localStorage.setItem(CURRENT_SLOT_KEY, String(CURRENT_SLOT)); }catch(e){}
  saveToSlot(CURRENT_SLOT);
  init();
}
/* 删除槽 */
function clearSlot(n){
  try{ localStorage.removeItem(slotKey(n)); localStorage.removeItem(slotKey(n) + "_meta"); }catch(e){}
}
function clearSave(){ clearSlot(CURRENT_SLOT); }

/* ---------- 导出 / 导入 ---------- */
function exportSave(){
  const data = { slot: CURRENT_SLOT, state: STATE, ver: 1 };
  const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "淫欲系统存档_第" + CURRENT_SLOT + "档_第" + STATE.day + "天.json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importSave(file){
  const reader = new FileReader();
  reader.onload = function(){
    try{
      const data = JSON.parse(reader.result);
      if(data && data.state){
        STATE = data.state;
        ensureStateCompat();
        CURRENT_SLOT = (data.slot >= 1 && data.slot <= SLOT_COUNT) ? data.slot : 1;
        try{ localStorage.setItem(CURRENT_SLOT_KEY, String(CURRENT_SLOT)); }catch(e){}
        saveToSlot(CURRENT_SLOT);
        init();
        alert("导入成功！已载入第 " + CURRENT_SLOT + " 档。");
      } else {
        alert("导入失败：不是有效的存档文件。");
      }
    }catch(e){
      alert("导入失败：文件格式错误。");
    }
  };
  reader.readAsText(file);
}

/* ============================================================================
 *  角色生成（开局随机组合）
 *  女生 = 性格(30) × 身份(30) × 经验(30) + 随机女名
 *  朋友/下属 = 随机名 + 随机身份（无数值）
 * ==========================================================================*/
function shuffleArr(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pickName(pool, used){
  let name;
  let guard = 0;
  do {
    name = pool[Math.floor(Math.random() * pool.length)];
    guard++;
  } while(used.has(name) && guard < 200);
  used.add(name);
  return name;
}
function generateGirls(opts){
  opts = opts || { countMain: CONFIG.initialGirls.main, countSide: CONFIG.initialGirls.side };
  const pool = CONFIG.girl_pool;
  const personalities = shuffleArr(pool.personality);
  const identities  = shuffleArr(pool.identity);
  const exps        = shuffleArr(pool.exp);
  const xps         = shuffleArr(CONFIG.xp_pool);
  const namePool = (typeof NAME_POOL !== "undefined" && NAME_POOL.female) ? NAME_POOL.female : ["小雅","小梦","小雨","小月","小婷"];
  const usedNames = new Set(Object.values(STATE ? STATE.girls : {}).map(g => g.name).filter(Boolean));
  const girls = [];
  // 女主
  for(let i = 0; i < (opts.countMain || 0); i++){
    const exp = exps[i];
    const slot = nextFreeSlot("g", CONFIG.girl_count.main);
    girls.push({
      id: "g" + slot,
      role: "main",
      type: "长",
      name: pickName(namePool, usedNames),
      personality: personalities[i] + "，" + identities[i] + "，" + exp.text,
      xp: xps[i],
      expCount: exp.expCount,
      virgin: exp.virgin,
      emoji: CONFIG.girl_emojis[Math.floor(Math.random() * CONFIG.girl_emojis.length)],
      firstMeet: "在校园里遇见的" + identities[i] + "，你们的故事从一次普通的相遇开始。",
    });
  }
  // 女配
  const sideTypes = ["长","中","短"];
  for(let i = 0; i < (opts.countSide || 0); i++){
    const exp = exps[CONFIG.girl_count.main + i];
    const slot = nextFreeSlot("s", CONFIG.girl_count.side);
    girls.push({
      id: "s" + slot,
      role: "side",
      type: sideTypes[i % sideTypes.length],
      name: pickName(namePool, usedNames),
      personality: personalities[CONFIG.girl_count.main + i] + "，" + identities[CONFIG.girl_count.main + i] + "，" + exp.text,
      xp: xps[CONFIG.girl_count.main + i],
      expCount: exp.expCount,
      virgin: exp.virgin,
      emoji: CONFIG.girl_emojis[Math.floor(Math.random() * CONFIG.girl_emojis.length)],
      firstMeet: "因为" + identities[CONFIG.girl_count.main + i] + "的身份，你们有了交集。",
    });
  }
  return girls;
}

function nextFreeSlot(prefix, max){
  for(let i = 1; i <= max; i++){
    if(!STATE || !STATE.girls[prefix + i]) return i;
  }
  return -1; // 满
}
function generateFriends(count){
  if(count === undefined) count = CONFIG.friend_count.min + Math.floor(Math.random() * (CONFIG.friend_count.max - CONFIG.friend_count.min + 1));
  const namePool = (typeof NAME_POOL !== "undefined") ? NAME_POOL.male : ["阿杰","阿强","小军","大伟","小凯"];
  const usedNames = new Set(Object.values(STATE ? STATE.girls : {}).map(g => g.name).filter(Boolean));

      role: roles[i % roles.length],
    });
  }

}

/* 判定：P = 0.5 + (attr - diff)/40，钳制 [0.10, 0.90] */
function rollCheck(attrVal, diff){
  let p = 0.5 + (attrVal - diff) / 40;
  p = clamp(p, 0.10, 0.90);
  const r = rng();
  const crit = CONFIG.engine.critChance;
  if (r < crit) return { result:"crit", prob:p };
  if (r > 1 - crit) return { result:"bad", prob:p };
  return { result: r < p ? "success" : "fail", prob:p };
}

async function callAI(systemPrompt, userPrompt, onChunk){
  const body = {
    model: CONFIG.ai.model,
    messages: [
      { role:"system", content: systemPrompt },
      { role:"user", content: userPrompt },
    ],
    temperature: CONFIG.ai.temperature,
    max_tokens: CONFIG.ai.maxTokens,
    stream: true,
  };
  const resp = await fetch(CONFIG.ai.endpoint, {
    method:"POST",
    headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+CONFIG.ai.apiKey },
    body: JSON.stringify(body),
  });
  if(!resp.ok) throw new Error("HTTP "+resp.status+" "+await resp.text());
  if(!resp.body){
    // 无流支持则回落非流式
    const data = await resp.json();
    const txt = (data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) ? data.choices[0].message.content : "";
    if(!txt) throw new Error("AI 返回为空");
    if(onChunk) onChunk(txt);
    return txt.trim();
  }
  // SSE 流式解析
  const reader = resp.body.getReader();
  const decoder = new TextDecoder("utf-8");
  let buffer = "";
  let full = "";
  while(true){
    const { done, value } = await reader.read();
    if(done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split("\n");
    buffer = lines.pop();
    for(const line of lines){
      const l = line.trim();
      if(!l.startsWith("data:")) continue;
      const payload = l.slice(5).trim();
      if(payload === "[DONE]") continue;
      try{
        const j = JSON.parse(payload);
        const delta = (j && j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content) ? j.choices[0].delta.content : "";
        if(delta){
          full += delta;
          if(onChunk) onChunk(delta);
        }
      }catch(e){ /* 忽略解析错误 */ }
    }
  }
  if(!full) throw new Error("AI 返回为空");
  return full.trim();
}

/* 流式打字机渲染：onChunk 每收到一段就追加 */
function showStoryStream(onChunk){
  const box = $("#storyBox");
  if(!box) return { append(){} };
  const node = document.createElement('div');
  node.style.marginBottom = '10px';
  box.appendChild(node);
  const append = (txt) => {
    node.textContent += txt;
    box.scrollTop = box.scrollHeight;
    _prevStoryHTML = box.innerHTML;
  };
  if(typeof onChunk === "function") onChunk(append);
  return { node };
}
/* 本地兑底打字机流式：无 AI key 时也逐字渲染（返回 Promise，播完再继续） */
function typeLocalText(text, speed){
  speed = speed || 18; // 每字间隔 ms
  return new Promise(resolve => {
    const box = $("#storyBox");
    if(!box){ resolve(); return; }
    const node = document.createElement('div');
    node.style.marginBottom = '10px';
    box.appendChild(node);
    box.scrollTop = box.scrollHeight;
    let i = 0;
    const timer = setInterval(() => {
      if(i >= text.length){
        clearInterval(timer);
        resolve();
        return;
      }
      node.textContent += text[i];
      i++;
      box.scrollTop = box.scrollHeight;
      _prevStoryHTML = box.innerHTML;
    }, speed);
  });
}
function showRollTag(result){
  const map = { crit:'<span class="roll crit">大成功</span>', success:'<span class="roll ok">成功</span>', fail:'<span class="roll fail">失败</span>', bad:'<span class="roll bad">大失败</span>' };
  const box = $("#storyBox");
  if(!box) return;
  box.insertAdjacentHTML('beforeend', map[result]);
  box.scrollTop = box.scrollHeight;
  _prevStoryHTML = box.innerHTML;
}

  }
  const isOk = roll.result === "success" || roll.result === "crit";
  if(isOk){
    applyFx(g, bo.fx);

    applyFx(g, { aff: -1, mood: -3 });
  }
  refreshPhase(g);
  g.lastInteract = 0;

  if(!g.flags) g.flags = {};

  if(outcome){

      g.flags[outcome.flag] = true;
      if(outcome.flag === "confessCount" || outcome.flag.indexOf("Count") > 0){
        g.flags[outcome.flag] = (g.flags[outcome.flag] || 0) + 1;
      }
    }
    if(outcome.milestone){
      const ms = outcome.milestone
        .replace("{day}", STATE.day)
        .replace("{girl}", g.name);
      addMilestone(g, ms);
      addMemory(g, ms);
    }
  }
  // 失败时累计表白次数（confess_rejected 标记）
  if(!isOk && bo.branchKey === "表白"){
    g.flags.confessCount = (g.flags.confessCount || 0) + 1;
  }
  // 文本
  const resTxt = { crit:"大成功", success:"成功", fail:"失败", bad:"大失败" }[roll.result];
  showStory('【剧情】' + (bo.branchDesc || "") + '。你选择了：' + bo.label);
  showRollTag(roll.result);

  if(aiEnabled()){
    try {

        if(UI._streamAppend) UI._streamAppend(delta);
      });

      UI._streamAppend = null;
      text = (isOk ? "这一次，你们的关系向前迈了一大步。" : "这次没能如愿，但至少你试过了。") + "（" + bo.label + "）";
      await typeLocalText(text);

    text = (isOk ? "这一次，你们的关系向前迈了一大步。" : "这次没能如愿，但至少你试过了。") + "（" + bo.label + "）";
    await typeLocalText(text);
  }
  recordMemory(g, "剧情·" + (bo.branchDesc || bo.branchKey), bo, roll);
  checkMilestones(g);
  renderTopbarStatic();
  save();
  UI.typing = false;
  renderActionArea();
  setTimeout(() => openInteract(ev.gid), 800);

  const id = "u" + (Object.values(STATE.girls).reduce((mx, g) => { const n = parseInt((g.id||"").replace(/^u/,""), 10); return (n > mx) ? n : mx; }, 0) + 1);
  const personality = pick(pool.personality);
  const identity = pick(pool.identity);
  const exp = pick(pool.exp);
  const xp = pick(CONFIG.xp_pool);
  const namePool = (typeof NAME_POOL !== "undefined" && NAME_POOL.female) ? NAME_POOL.female : ["小雅","小梦","小雨"];
  const usedNames = new Set(Object.values(STATE.girls).map(g => g.name));
  const name = pickName(namePool, usedNames);
  return {
    id: id,
    role: "undef",
    type: "短",
    name: name,
    personality: personality + "，" + identity + "，" + exp.text,
    xp: xp,
    expCount: exp.expCount,
    virgin: exp.virgin,
    emoji: CONFIG.girl_emojis[Math.floor(Math.random() * CONFIG.girl_emojis.length)],
    firstMeet: "在校园里偶然遇见的" + identity + "。",
    aff: 5, lust: 0, mood: 70, phase: "stranger", met: true,
    orgasmCount: 0, creampieCount: 0, harem: false, lastInteract: 0, flags: {},
  };
}
/* 邂逅遇到新朋友（男生，随机名+随机身份） */
async function encounterFriend(){
  const scene = pick(["在操场", "在宿舍楼", "在食堂", "在社团活动室", "在教室", "在篮球场", "在图书馆", "在校门口"]);
  // 随机身份（不重复已用的）
  const usedRoles = new Set(STATE.friends.map(f => f.role));
  const avail = CONFIG.friend_roles.filter(r => !usedRoles.has(r));
  const role = avail.length ? pick(avail) : pick(CONFIG.friend_roles);
  // 随机男名（不重复）
  const namePool = (typeof NAME_POOL !== "undefined" && NAME_POOL.male) ? NAME_POOL.male : ["阿杰","阿强","小军"];
  const usedNames = new Set(STATE.friends.map(f => f.name));
  const name = pickName(namePool, usedNames);
  const newF = { id: "f" + (STATE.friends.length + 1), name: name, role: role };
  STATE.friends.push(newF);
  let text;
  if(aiEnabled()){
    try {
      showStoryStream(append => { UI._streamAppend = append; });
      text = await callAI(
        "你是《" + CONFIG.title + "》的叙事 AI。你叫周茂文，第一人称。写一段 100-180 字的校园邂逅，遇到一个男生朋友（" + role + "，叫" + name + "），自然认识，场景：" + scene + "。不要暴露系统存在。",
        "写出这段相识场景。",
        (delta) => { if(UI._streamAppend) UI._streamAppend(delta); }
      );
      UI._streamAppend = null;
    } catch(e){
      UI._streamAppend = null;
      text = "在" + scene + "，你认识了" + name + "（" + role + "），聊了几句，算是朋友了。";
      await typeLocalText(text);
    }
  } else {
    text = "在" + scene + "，你认识了" + name + "（" + role + "），聊了几句，算是朋友了。";
    await typeLocalText(text);
  }
  showStory('👥 新朋友：' + name + '（' + role + '）已加入你的人际圈。');
}

/* ---------- 过天 ---------- */
function nextDay(){
  if(UI.typing) return;
  advanceDay();
  // 刷新商城（每日）
  refreshDailyShop();
  clearStory(); // 新的一天开始
  showStory('🌙 第 ' + (STATE.day - 1) + ' 天结束，新的一天开始了。' + (CONFIG.ai.endpoint ? '' : ''));
  checkAchievements();
  save();
  if(STATE.day > CONFIG.engine.maxDays){
    endGame();
    return;
  }
  renderMain();
}

/* ---------- 商城刷新 ---------- */
function refreshDailyShop(){
  // 一次性道具：每天随机 4 个（未购买的不重复）
  const ss = STATE.shopState;
  if(ss.day !== STATE.day){
    ss.day = STATE.day;
    ss.manualItemRefreshes = 0;
    ss.manualAssetRefreshes = 0;
    const ownedItems = new Set(Object.keys(STATE.items));
    const pool = CONFIG.shop_items.filter(it => !ownedItems.has(it.id));
    ss.items = shuffleArr(pool).slice(0, CONFIG.shop_items_refresh.dailyCount).map(it => it.id);
    // 资产：每天 5 车 + 3 奢侈 + 5 房
    refreshAssetsDaily();
  }
}
function refreshAssetsDaily(){
  const ss = STATE.shopState;
  const ownedCar = new Set(STATE.assets.car || []);
  const ownedLux = new Set(STATE.assets.luxury || []);
  const ownedHouse = new Set(STATE.assets.house || []);
  ss.assets.car = shuffleArr(ASSET_POOL.car.filter(a => !ownedCar.has(a.name))).slice(0, CONFIG.shop_assets.dailyCar).map(a => a.name);
  ss.assets.luxury = shuffleArr(ASSET_POOL.luxury.filter(a => !ownedLux.has(a.name))).slice(0, CONFIG.shop_assets.dailyLux).map(a => a.name);
  ss.assets.house = shuffleArr(ASSET_POOL.house.filter(a => !ownedHouse.has(a.name))).slice(0, CONFIG.shop_assets.dailyHouse).map(a => a.name);
}

/* 角色定性 */
function setRole(gid, role){
  const g = girlById(gid);
  if(!g) return;
  if(role === "main"){
    const mains = Object.values(STATE.girls).filter(x => x.role === "main").length;
    if(mains >= 5){
      showStory('女主数量已达上限 5 人，无法再设为女主。');
      renderRelations();
      return;
    }
    g.role = "main";
    showStory('💜 ' + g.name + ' 被设定为女主！现在可以全力攻略她了。');
  } else if(role === "side"){
    g.role = "side";
    showStory('🌸 ' + g.name + ' 被设定为女配，你们的关系线会继续发展。');
  } else if(role === "stranger"){
    g.role = "stranger";
    g.met = false;
    showStory('🚶 ' + g.name + ' 与你的交集到此为止，成为一段路人回忆。');
    addMemory(g, "第" + STATE.day + "天：你与她断了联系，她成了你生命中的一个过客。");
  }
  checkMilestones(g);
  checkAchievements();
  save();
  renderRelations();
}
function breakup(gid){
  const g = girlById(gid);
  if(!g) return;
  if(g.harem){
    showStory('后宫成员无法断交。');
    return;
  }
  g.met = false;
  showStory('✂️ 你与 ' + g.name + ' 的关系结束了。');
  save();
  renderRelations();
}

/* 商城页 */
function renderShop(){
  const content = $("#sysContent");
  if(!content) return;
  refreshDailyShop();
  const ss = STATE.shopState;
  let html = '<div class="card"><h3 style="margin-bottom:8px">🎯 一次性道具（今日 ' + ss.items.length + ' 款）</h3>';
  const ownedItems = new Set(Object.keys(STATE.items));
  ss.items.forEach(id => {
    const it = CONFIG.shop_items.find(x => x.id === id);
    if(!it) return;
    const bought = ownedItems.has(id);
    html += '<div class="shop-item"><div class="s-ico">' + it.name.split(' ')[0] + '</div>' +
      '<div class="s-info"><div class="s-name">' + it.name + '</div><div class="s-desc">' + it.desc + '</div></div>' +
      '<div class="s-price">' + it.price + '</div>' +
      '<button ' + (bought || STATE.lust < it.price ? 'disabled' : '') + ' onclick="buyItem(\'' + id + '\')">' + (bought ? '已购' : '购买') + '</button></div>';
  });
  if(!ss.items.length) html += '<div class="hint">今日无新道具（都买完了？）。</div>';
  html += '<button class="btn small" ' + (ss.manualItemRefreshes >= CONFIG.shop_items_refresh.manualRefreshLimit || STATE.lust < CONFIG.shop_items_refresh.manualRefreshCost ? 'disabled' : '') + ' onclick="manualRefreshItems()">🔄 手动刷新（' + CONFIG.shop_items_refresh.manualRefreshCost + '淫欲值，剩 ' + (CONFIG.shop_items_refresh.manualRefreshLimit - ss.manualItemRefreshes) + ' 次）</button></div>';
  // 技能
  html += '<div class="card"><h3 style="margin-bottom:8px">📈 技能提升</h3>';
  CONFIG.shop_skills.forEach(sk => {
    const bought = STATE.skills[sk.fx.skill] || (sk.fx.attr && Object.keys(sk.fx.attr).every(k => STATE.attrs[k] > 80));
    const disabled = bought || STATE.lust < sk.price;
    html += '<div class="shop-item"><div class="s-ico">' + sk.name.split(' ')[0] + '</div>' +
      '<div class="s-info"><div class="s-name">' + sk.name + '</div><div class="s-desc">' + sk.desc + '</div></div>' +
      '<div class="s-price">' + sk.price + '</div>' +
      '<button ' + (disabled ? 'disabled' : '') + ' onclick="buySkill(\'' + sk.id + '\')">' + (bought ? '已学' : '学习') + '</button></div>';
  });
  html += '</div>';
  // 硬件
  html += '<div class="card"><h3 style="margin-bottom:8px">📏 硬件强化</h3>';
  ['len','girth','dura'].forEach(k => {
    const h = CONFIG.hardware[k];
    const cur = STATE.hardware[k];
    const next = Math.min(h.max, cur + h.step);
    if(cur >= h.max){
      html += '<div class="shop-item"><div class="s-info"><div class="s-name">' + h.name + '</div><div class="s-desc">已满级（' + cur + h.unit + '）</div></div></div>';
      return;
    }
    const disabled = STATE.lust < h.cost;
    html += '<div class="shop-item"><div class="s-info"><div class="s-name">📏 ' + h.name + ' 强化</div><div class="s-desc">' + cur + h.unit + ' → ' + next + h.unit + '（上限 ' + h.max + h.unit + '）</div></div>' +
      '<div class="s-price">' + h.cost + '</div>' +
      '<button ' + (disabled ? 'disabled' : '') + ' onclick="buyHardware(\'' + k + '\')">强化</button></div>';
  });
  html += '</div>';
  // 资产
  html += '<div class="card"><h3 style="margin-bottom:8px">🏠 现实资产（今日上架）</h3>';
  [['car','🚗 汽车'],['luxury','💎 奢侈品'],['house','🏠 房产']].forEach(([k,label]) => {
    const list = ss.assets[k] || [];
    if(!list.length) return;
    html += '<div class="hint" style="margin-top:8px">' + label + '</div>';
    list.forEach(name => {
      const asset = ASSET_POOL[k].find(a => a.name === name);
      if(!asset) return;
      const disc = 0.4 + Math.random() * 0.4;
      const sysPrice = Math.round(asset.price * disc / 1000);
      html += '<div class="shop-item"><div class="s-ico">' + (k === "car" ? "🚗" : k === "house" ? "🏠" : "💎") + '</div>' +
        '<div class="s-info"><div class="s-name">' + asset.name + '</div><div class="s-desc">市场价 ¥' + fmt(asset.price) + ' · 折扣 ' + disc.toFixed(2) + '</div></div>' +
        '<div class="s-price">' + sysPrice + '</div>' +
        '<button ' + (STATE.lust < sysPrice ? 'disabled' : '') + ' onclick="buyAsset(\'' + k + '\',\'' + name.replace(/'/g,"\\'") + '\')">买</button></div>';
    });
  });
  html += '<button class="btn small" ' + (STATE.lust < CONFIG.shop_assets.manualRefreshCost ? 'disabled' : '') + ' onclick="manualRefreshAssets()">🔄 刷新资产（' + CONFIG.shop_assets.manualRefreshCost + '淫欲值）</button></div>';
  content.innerHTML = html;
}
function manualRefreshItems(){
  const ss = STATE.shopState;
  if(ss.manualItemRefreshes >= CONFIG.shop_items_refresh.manualRefreshLimit) return;
  if(STATE.lust < CONFIG.shop_items_refresh.manualRefreshCost) return;
  STATE.lust -= CONFIG.shop_items_refresh.manualRefreshCost;
  ss.manualItemRefreshes++;
  const ownedItems = new Set(Object.keys(STATE.items));
  const pool = CONFIG.shop_items.filter(it => !ownedItems.has(it.id));
  ss.items = shuffleArr(pool).slice(0, CONFIG.shop_items_refresh.dailyCount).map(it => it.id);
  save();
  renderShop();
}
function manualRefreshAssets(){
  const ss = STATE.shopState;
  if(STATE.lust < CONFIG.shop_assets.manualRefreshCost) return;
  STATE.lust -= CONFIG.shop_assets.manualRefreshCost;
  refreshAssetsDaily();
  save();
  renderShop();
}
function buyItem(id){
  const it = CONFIG.shop_items.find(x => x.id === id);
  if(!it || STATE.items[id] || STATE.lust < it.price) return;
  STATE.lust -= it.price;
  STATE.items[id] = { used: false, active: it.active };
  // 永久被动直接生效
  if(it.fx.permanent && it.fx.passive === "immune") STATE.immune = true;
  if(it.fx.permanent && it.fx.passive === "contracept") STATE.contracept = true;
  if(it.fx.cash) STATE.cash += it.fx.cash;
  if(it.fx.effect === "energy") STATE.energy = CONFIG.engine.maxEnergy;
  if(it.fx.effect === "seduce") { /* 已购即生效一次 */ }
  showStory('✅ 购买 ' + it.name + ' 成功！');
  checkAchievements();
  save();
  renderShop();
}
function buySkill(id){
  const sk = CONFIG.shop_skills.find(x => x.id === id);
  if(!sk || STATE.lust < sk.price) return;
  STATE.lust -= sk.price;
  if(sk.fx.skill) STATE.skills[sk.fx.skill] = true;
  if(sk.fx.attr){
    Object.entries(sk.fx.attr).forEach(([k,v]) => {
      STATE.attrs[k] = clamp((STATE.attrs[k] !== undefined && STATE.attrs[k] !== null) ? STATE.attrs[k] + v : 55 + v, CONFIG.engine.attrMin, CONFIG.engine.attrMax);
    });
  }
  showStory('✅ 学习 ' + sk.name + ' 成功！');
  save();
  renderShop();
}
function buyHardware(k){
  const h = CONFIG.hardware[k];
  const cur = STATE.hardware[k];
  if(cur >= h.max || STATE.lust < h.cost) return;
  STATE.lust -= h.cost;
  STATE.hardware[k] = Math.min(h.max, cur + h.step);
  showStory('✅ ' + h.name + ' 强化成功：' + cur + h.unit + ' → ' + STATE.hardware[k] + h.unit);
  save();
  renderShop();
}
function buyAsset(k, name){
  const asset = ASSET_POOL[k].find(a => a.name === name);
  if(!asset) return;
  const disc = 0.4 + Math.random() * 0.4;
  const sysPrice = Math.round(asset.price * disc / 1000);
  if(STATE.lust < sysPrice) return;
  STATE.lust -= sysPrice;
  if(!STATE.assets[k]) STATE.assets[k] = [];
  STATE.assets[k].push(name);
  showStory('✅ 购入 ' + name + '（约 ¥' + fmt(asset.price) + '，系统价 ' + sysPrice + ' 淫欲值）！');
  checkAchievements();
  save();
  renderShop();
}

/* ---------- 成就 ---------- */
function checkAchievements(){
  CONFIG.achievements.forEach(a => {
    if(!STATE.achievements[a.id] && a.check()){
      STATE.achievements[a.id] = true;
      showStory('🏆 达成成就：' + a.name + ' —— ' + a.desc);
    }
  });
}

/* ---------- 存档页 ---------- */
function renderSave(){
  const content = $("#sysContent");
  if(!content) return;
  let html = '<div class="card"><h3 style="margin-bottom:8px">💾 存档管理</h3>';
  html += '<div class="hint">当前档：第 ' + CURRENT_SLOT + ' 档 · 第 ' + STATE.day + ' 天</div>';
  for(let n = 1; n <= SLOT_COUNT; n++){
    const m = getSlotMeta(n);
    const isCur = n === CURRENT_SLOT;
    html += '<div class="shop-item" style="margin-top:10px">' +
      '<div class="s-ico">' + (m ? "💾" : "🆕") + '</div>' +
      '<div class="s-info"><div class="s-name">第 ' + n + ' 档' + (isCur ? ' <span class="tag hot">当前</span>' : '') + '</div>' +
      '<div class="s-desc">' + (m ? "第 " + m.day + " 天 · 后宫 " + m.harem + "/5 · 淫欲值 " + fmt(m.lust) + (m.time ? " · " + new Date(m.time).toLocaleString() : "") : "空档") + '</div></div>' +
      '<button onclick="saveToSlot(' + n + ');renderSave();alert(\'已存档到第 ' + n + ' 档\')">存</button>' +
      (m ? '<button onclick="loadFromSlot(' + n + ');init()">读</button><button onclick="clearSlot(' + n + ');renderSave()">删</button>' : '') +
    '</div>';
  }
  html += '</div>';
  html += '<div class="card"><h3 style="margin-bottom:8px">📤 导出 / 📥 导入</h3>' +
    '<button class="btn small" onclick="exportSave()">📤 导出当前存档（.json）</button>' +
    '<button class="btn small" onclick="document.getElementById(\'importFile\').click()">📥 导入存档</button>' +
    '<input type="file" id="importFile" accept=".json" style="display:none" onchange="importSave(this.files[0])">' +
    '<div class="hint">导出后可换设备导入继续玩（手机/电脑通用）。</div></div>';
  content.innerHTML = html;
}

/* ---------- 角色档案页 ---------- */
function renderCards(){
  const content = $("#sysContent");
  if(!content) return;
  let html = '<div class="card"><h3 style="margin-bottom:8px">🧬 主角快照</h3><div style="white-space:pre-wrap;font-size:12px;line-height:1.8">' + escHtml(playerSnapshotMD()) + '</div></div>';
  const cards = Object.values(STATE.girls).filter(g => g.met && (g.harem || g.role === "main" || g.role === "side" || g.role === "undef"));
  if(!cards.length){
    html += '<div class="hint">还没有重要角色。</div>';
  }
  cards.forEach(g => {
    html += '<div class="card"><div style="white-space:pre-wrap;font-size:12px;line-height:1.8">' + escHtml(girlCardMD(g)) + '</div></div>';
  });
  html += '<button class="btn small" onclick="downloadAllCards()">📥 下载全部角色档案（.md）</button>';
  content.innerHTML = html;
}
function escHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function downloadAllCards(){
  let md = "# 淫欲系统 · 角色档案\n\n";
  md += playerSnapshotMD() + "\n";
  Object.values(STATE.girls).filter(g => g.met && (g.harem || g.role === "main" || g.role === "side" || g.role === "undef")).forEach(g => {
    md += "\n" + girlCardMD(g) + "\n";
  });
  const blob = new Blob([md], { type: "text/markdown" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "角色档案_第" + STATE.day + "天.md";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ---------- 结局 ---------- */
function endGame(){
  const app = $("#app");
  // 简单结算
  let ending = CONFIG.endings[2];
  if(STATE.harem.length >= 3 && STATE.totalLustGain > 5000) ending = CONFIG.endings[0];
  else if(STATE.harem.length > 0) ending = CONFIG.endings[1];
  STATE.ending = ending.id;
  save();
  app.innerHTML =
    '<div class="end-hero"><div class="emoji">' + ending.emoji + '</div>' +
    '<h2>' + ending.name + '</h2><div class="sub">' + ending.desc + '</div></div>' +
    '<div class="card"><div class="stats-grid">' +
    '<div class="cell"><div class="k">累计淫欲值</div><div class="v">' + fmt(STATE.totalLustGain) + '</div></div>' +
    '<div class="cell"><div class="k">后宫人数</div><div class="v">' + STATE.harem.length + '/5</div></div>' +
    '<div class="cell"><div class="k">现金</div><div class="v">¥' + fmt(STATE.cash) + '</div></div>' +
    '<div class="cell"><div class="k">破处数</div><div class="v">' + STATE.virginConquered + '</div></div>' +
    '</div></div>' +
    '<button class="btn primary" onclick="resetGame()">🔄 重新开始</button>';
}
function resetGame(){
  clearSave();
  STATE = defaultState();
  location.reload();
}

/* ---------- 初始化 ---------- */
/* ---------- AI 设置（本地存储，不进代码） ---------- */
const AI_CFG_KEY = "lust_system_ai_cfg";
function loadAiConfig(){
  try{
    const raw = localStorage.getItem(AI_CFG_KEY);
    if(raw){
      const cfg = JSON.parse(raw);
      if(cfg.endpoint) CONFIG.ai.endpoint = cfg.endpoint;
      if(cfg.apiKey) CONFIG.ai.apiKey = cfg.apiKey;
      if(cfg.model) CONFIG.ai.model = cfg.model;
    }
  }catch(e){}
}
function saveAiConfig(endpoint, apiKey, model){
  try{
    localStorage.setItem(AI_CFG_KEY, JSON.stringify({ endpoint, apiKey, model }));
  }catch(e){}
}

function init(){
  loadAiConfig();
  load();
  // 旧存档兼容
  if(!STATE.hardware) STATE.hardware = { len: CONFIG.hardware.len.init, girth: CONFIG.hardware.girth.init, dura: CONFIG.hardware.dura.init };
  if(!STATE.assets) STATE.assets = { car: [], house: [], luxury: [] };
  if(!STATE.shopState) STATE.shopState = { day: 0, items: [], assets: { car: [], house: [], luxury: [] }, manualItemRefreshes: 0, manualAssetRefreshes: 0 };
  if(!STATE.friends) STATE.friends = [];   // 旧档兼容：无则空，激活时生成核心 2 人
  // 未定性标记：开局生成的女主/女配保持原样
  refreshDailyShop();
  renderMain();
}
init();
</script>
